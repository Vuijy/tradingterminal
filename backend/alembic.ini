# Alembic configuration. The database URL comes from app settings (DATABASE_URL);
# app/db/migrate.py injects it at runtime, and alembic/env.py falls back to settings
# when the CLI is used directly:  cd backend; alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
