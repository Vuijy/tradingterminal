[project]
name = "tradingterminal-backend"
version = "0.1.0"
description = "API backend for the Trading Terminal: market data, fundamentals, macro, news, supply-chain graph."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pandas>=2.2",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # the local migrations folder is also called alembic

[tool.ruff.lint.per-file-ignores]
# Regex tables and real filing sentences do not wrap nicely.
"app/services/relationship_extraction.py" = ["E501"]
"app/services/relationships.py" = ["E501"]
"app/services/entity_resolution.py" = ["E501"]
"app/services/providers/efts.py" = ["E501"]
"tests/test_relationship_extraction.py" = ["E501"]
"tests/test_relationships.py" = ["E501"]
"tests/test_filing_text.py" = ["E501"]
"tests/test_entity_resolution.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
